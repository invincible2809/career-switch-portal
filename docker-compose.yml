services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: csp
      POSTGRES_PASSWORD: csp
      POSTGRES_DB: csp_dev
    ports:
      - "5433:5432"
    volumes:
      - csp-db:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csp -d csp_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  csp-db:
